    <title>Deen Hijrah Academia</title>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('dha_theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
